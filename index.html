<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IELTS Vocab</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5fd;--ink:#1f2347;--mut:#6c7194;--pri:#5848e5;--pd:#4337bd;--soft:#ecebff;--line:#e4e6f5;--sun:#ffb21a;--ok:#1fb26b;--bad:#ff5a6e;--sh:0 6px 20px rgba(60,60,140,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Nunito","Noto Sans","Segoe UI",system-ui,sans-serif}
h1,h2,.logo,.w,.big,.vi,.fire b{font-family:"Nunito","Noto Sans",system-ui,sans-serif;font-weight:800}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.logo{font-size:20px;color:var(--pri)}#hx{display:flex;gap:6px}nav{display:flex;gap:4px;flex:1;justify-content:center}
nav a{cursor:pointer;padding:7px 14px;border-radius:99px;color:var(--mut);font-weight:800;display:flex;gap:6px;align-items:center}nav a i{font-style:normal}nav a.on{background:var(--soft);color:var(--pri)}
main{max-width:720px;margin:0 auto;padding:22px 16px 90px}h1{font-size:28px;margin:.2em 0 .4em}h2{font-size:19px;margin:1.6em 0 .5em}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0;box-shadow:var(--sh)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.top{margin-bottom:10px}
button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:11px 18px;cursor:pointer;background:var(--pri);color:#fff;box-shadow:0 4px 0 var(--pd);transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:none}button.g{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}button.g:active{background:var(--soft)}
button.sm{padding:7px 12px;font-size:14px;border-radius:12px}button.wide{width:100%}button.n{background:var(--bad);box-shadow:0 4px 0 #cc3f50}button.p{background:var(--sun);color:#3b2a00;box-shadow:0 4px 0 #c88a0c}button.m{background:var(--ok);box-shadow:0 4px 0 #148a52}
:focus-visible{outline:3px solid #9a90ff;outline-offset:2px}
input,textarea{font:inherit;width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}input:focus,textarea:focus{outline:none;border-color:var(--pri)}
label{display:block;font-weight:800;margin:12px 0 5px}.mut{color:var(--mut);font-size:14px}.tag{font-size:13px;font-weight:800;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--pri)}.tag.hot{background:#fff1d6;color:#a96a00}
.bar{height:12px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .3s}.bar.sm{height:8px;margin:6px 0 4px}
.hero{display:flex;gap:16px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#5848e5,#8a63f2);color:#fff;border-radius:26px;padding:22px;box-shadow:var(--sh)}
.hi{font:800 24px "Nunito","Noto Sans",sans-serif}.mut2{opacity:.88;font-size:14px;margin-top:4px}.fire{background:rgba(255,255,255,.18);border-radius:20px;padding:10px 16px;text-align:center;display:flex;flex-direction:column;line-height:1.1}.fire span{font-size:26px}.fire b{font-size:30px}.fire small{opacity:.85}
.set{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.set.due{border-left:6px solid var(--sun)}.empty{text-align:center;color:var(--mut);font-size:30px}.empty p{font-size:15px;margin:6px 0 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--sh)}.tile span{font-size:30px}.tile b{font:800 18px "Nunito","Noto Sans",sans-serif}.tile small{color:var(--mut)}.tile:active{background:var(--soft)}
.fc{text-align:center;padding:30px 16px;min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;border-radius:28px}
.fc .w{font-size:44px;line-height:1.15;overflow-wrap:anywhere}.ipa{color:var(--mut);font-size:19px;font-family:"Noto Sans","Segoe UI","Lucida Sans Unicode",system-ui,sans-serif;letter-spacing:0}.hint{color:var(--mut);font-size:14px;margin:8px 0 0}
.ans{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:6px;border-top:2px dashed var(--line);padding-top:16px;width:100%}.vi{font-size:28px;color:var(--pri)}.ex{font-size:17px;max-width:30em;margin:2px 0}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.three button{display:flex;flex-direction:column;align-items:center;font-size:26px;padding:12px 6px}.three small{font-size:13px}
.nav2{margin-top:6px}.q{text-align:center;padding:26px 18px}.qh{color:var(--mut);font-weight:800;margin-bottom:10px}.q .big{font-size:34px;color:var(--pri)}.sent{font-size:21px;line-height:1.6}.q input{margin:16px 0;text-align:center;font-size:18px}.bigbtn{font-size:30px;padding:14px 26px;border-radius:50%}
.fb{border-radius:16px;padding:12px;margin:0 0 14px;text-align:left}.fb.good{background:#e3f8ed;color:#0f6a40}.fb.miss{background:#ffe9ec;color:#a42a3b}.emo{font-size:52px}
.login{max-width:420px;margin:0 auto;text-align:center}.login .card{text-align:left}.mascot{font-size:64px}.login summary{cursor:pointer;font-weight:800;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}td input{padding:7px}.wrap{overflow-x:auto}
.ok{color:var(--ok);font-weight:800}.bad{color:var(--bad);font-weight:800}.big{font-size:34px}.lnk{cursor:pointer;color:var(--pri);font-weight:800}
#t{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;display:none;z-index:9;max-width:92vw;text-align:center}
.flip{perspective:1400px;cursor:pointer;margin:4px 0}.flipin{display:grid;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}.flipin.on{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:var(--sh);padding:22px 16px;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.back{transform:rotateY(180deg);background:#fbfaff}.face .w{font-size:42px;line-height:1.15;overflow-wrap:anywhere}.face .hint{margin:4px 0 0}
.spk{width:46px;height:46px;border-radius:50%;padding:0;font-size:20px;background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}.spk:active{background:var(--soft)}
.repchip{display:inline-block;background:#fff1d6;color:#a96a00;font-weight:800;border-radius:99px;padding:3px 12px;margin-bottom:8px;font-size:13px}.three{margin:12px 0 8px}
.sched{display:grid;gap:6px;margin:8px 0;text-align:left}.sched div{display:flex;justify-content:space-between;gap:8px;background:var(--soft);border-radius:12px;padding:8px 12px;font-size:14px}.hero2{background:var(--soft);border-radius:18px;padding:14px;margin:12px 0}.hero2 b{display:block;font-size:22px;color:var(--pri)}
button:disabled{opacity:.5;cursor:default}
.tm{display:flex;align-items:center;gap:8px;margin:-4px 0 10px}.tm .bar{flex:1;margin:0;height:10px}.tm .bar i{background:var(--sun);transition:width .1s linear}.tm .bar.low i{background:var(--bad)}.tm b{min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.opt{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none;text-align:left;padding:14px;font-weight:700}.opt:active{background:var(--soft)}.opt.bad{background:#ffe9ec;border-color:var(--bad);color:#a42a3b}.opt.right{background:#e3f8ed;border-color:var(--ok);color:#0f6a40;opacity:1}
.ordans{min-height:58px;border:2px dashed var(--line);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:14px 0 10px}.ordpool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.chip{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);padding:8px 14px;border-radius:12px}.chip.on{background:var(--soft);border-color:var(--pri);color:var(--pri);box-shadow:0 3px 0 #c9c4ff}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.mc{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none;padding:12px 8px;min-height:56px;font-size:15px}.mc.sel{border-color:var(--pri);background:var(--soft)}.mc.ok{background:#e3f8ed;border-color:var(--ok);color:#0f6a40;opacity:.8}.mc.bad{background:#ffe9ec;border-color:var(--bad)}
@media(max-width:700px){.opts{grid-template-columns:1fr}}
@media(max-width:700px){nav.st{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav.st a{flex-direction:column;gap:0;font-size:12px;padding:4px 12px;border-radius:14px}nav.st a i{font-size:22px}#t{bottom:90px}.hero{flex-direction:column;align-items:flex-start}.face .w{font-size:34px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head></head><body>
<header><div class="logo">📘 IELTS Vocab</div><nav id="nav"></nav><div id="hx"></div></header>
<main id="app"></main><div id="t"></div>
<script>
const K='ielts_v1',TZ='Asia/Ho_Chi_Minh',DAYS=[1,3,7,12,18,24,30],D=864e5,REP={n:3,p:2,m:1};
let db=JSON.parse(localStorage.getItem(K)||'null')||{sets:[],students:{},teacher:null,key:'',me:null,role:null},V={p:'login'};
const $=s=>document.querySelector(s),save=()=>localStorage.setItem(K,JSON.stringify(db)),uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dk=d=>new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(d),fd=t=>t?new Date(t).toLocaleString('vi-VN'):'—';
const S=()=>db.role==='s'?(db.remote||db.sets):db.sets,me=()=>db.students[db.me],P=sid=>me().prog[sid]??={first:Date.now(),pos:0,rev:0,pr:0},W=id=>me().words[id]??={st:'n',seen:0,c:0,w:0};
const setOf=id=>id==='me'?{id:'me',book:'Từ vựng cá nhân',items:me().personal,status:'pub'}:S().find(s=>s.id===id);
const act=s=>s.items.filter(i=>!i.arch),title=s=>s.id==='me'?s.book:`${s.book}${s.test?' – Test '+s.test:''}${s.passage?' – Passage '+s.passage:''}`;
const due=p=>p&&p.init&&p.next&&p.next<=Date.now(),lg=(t,sid,x={})=>me().log.push({t,sid,at:Date.now(),...x});
function toast(m){const e=$('#t');e.textContent=m;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2800)}
function go(p,x={}){V={p,...x};render();scrollTo(0,0)}
function streakNow(){const m=me();return(m.day===dk(new Date())||m.day===dk(new Date(Date.now()-D)))?m.streak:0}
function bump(){const m=me(),t=dk(new Date());if(m.day===t)return;m.streak=m.day===dk(new Date(Date.now()-D))?m.streak+1:1;m.day=t}
function accent(){db.acc=db.acc==='en-US'?'en-GB':'en-US';save();render();toast('Đã chọn giọng '+(db.acc==='en-US'?'Mỹ':'Anh'))}
function speak(txt){if(!('speechSynthesis' in window))return toast('Trình duyệt không hỗ trợ âm thanh');const L=db.acc||'en-GB',v=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-')===L);
 if(!v)return toast('Máy chưa có giọng '+(L==='en-GB'?'Anh':'Mỹ')+'. Bấm "Giọng" trên menu để đổi giọng khác.');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.voice=v;u.lang=L;speechSynthesis.speak(u)}
speechSynthesis?.getVoices();
async function hash(s){return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function freeGen(ws){const out=[];for(const w of ws){let ipa='',pos='',ex='',vi='';
 try{const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w));if(r.ok){const e=(await r.json())[0];ipa=(e.phonetics||[]).map(p=>p.text).find(Boolean)||e.phonetic||'';pos=e.meanings?.[0]?.partOfSpeech||'';ex=(e.meanings||[]).flatMap(m=>m.definitions).map(d=>d.example).find(Boolean)||''}}catch{}
 try{const j=await(await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(w)+'&langpair=en|vi')).json();const t=j.responseData?.translatedText||'';vi=/MYMEMORY|QUERY LENGTH/i.test(t)?'':t}catch{}
 out.push({id:uid(),word:w,ipa,vi,pos,ex})}return out}
const ai=ws=>freeGen(ws);
/* ---------- auth ---------- */
function login(){const n=$('#n').value.trim().replace(/\s+/g,' '),c=$('#c').value.trim().replace(/\s+/g,' ');if(!n||!c)return toast('Nhập đủ tên và lớp');
 const k=(n+'|'+c).toLowerCase();db.students[k]??={name:n,cls:c,first:Date.now(),prog:{},words:{},personal:[],log:[],streak:0,day:null};db.me=k;db.role='s';me().last=Date.now();save();go('home')}
async function tlogin(){const p=$('#pw').value;if(p.length<6)return toast('Mật khẩu tối thiểu 6 ký tự');const h=await hash(p);
 if(!db.teacher){db.teacher=h;toast('Đã đặt mật khẩu cho thầy T')}else if(db.teacher!==h)return toast('Sai mật khẩu');db.role='t';save();go('tsets')}
function out(){db.role=null;db.me=null;save();go('login')}
/* ---------- student ---------- */
function btnFor(s){const p=me().prog[s.id];return !p?`<button onclick="openSet('${s.id}',1)">Start Learning</button>`:!p.init?`<button onclick="openSet('${s.id}',1)">Continue Learning</button>`:due(p)?`<button onclick="startReview('${s.id}')">Review Now</button>`:`<button class="g" onclick="go('set',{sid:'${s.id}'})">Mở bộ từ</button>`}
function openSet(sid){begin(sid,'learn')}
function saveHard(s,p){act(s).forEach(i=>{W(i.id).hd=p.ses.hard[i.id]||''})}
function begin(sid,mode){const s=setOf(sid),p=P(sid),L=act(s),t=dk(new Date()),n=p.rev+1;let z=p.ses;
 if(!z||z.k!==mode||z.d!==t||(mode==='review'&&z.n!==n)){
  const hr={n:0,p:1};let order=L.map(x=>x.id);
  if(mode==='review')order=[...L].sort((a,b)=>(hr[W(a.id).hd]??2)-(hr[W(b.id).hd]??2)).map(x=>x.id);
  z=p.ses={k:mode,d:t,n,ok:[],hard:{},order};
  if(mode==='learn'&&!p.init)L.forEach(x=>{const w=W(x.id);w.st='n';w.seen=0;w.hd=''})}
 const q=z.order.filter(id=>!z.ok.includes(id)&&L.some(x=>x.id===id));
 V={p:'fc',sid,mode,q,pend:[],show:null,hist:[],total:L.length,rep:0,flip:0,rv:0};scrollTo(0,0);advance()}
function home(){const m=me(),dl=S().filter(s=>s.status==='pub'&&due(m.prog[s.id])).sort((a,b)=>m.prog[a.id].next-m.prog[b.id].next),st=streakNow(),h=new Date().getHours();
 return`<div class="hero"><div><div class="hi">${h<12?'Chào buổi sáng':h<18?'Chào buổi chiều':'Chào buổi tối'}, ${esc(m.name.split(' ')[0])}!</div><div class="mut2">${st?'Giữ lửa nhé, hôm nay học thêm một chút!':'Hoàn thành 1 lượt Flashcards, Review hoặc Practice để bắt đầu chuỗi ngày học.'}</div></div><div class="fire"><span>🔥</span><b>${st}</b><small>ngày</small></div></div>
 <h2>Review Today</h2>${dl.length?dl.map(s=>`<div class="card set due"><div><b>${esc(s.book)}</b><div class="mut">${esc(title(s).slice(s.book.length+3)||'')}</div></div><button onclick="startReview('${s.id}')">Review Now</button></div>`).join(''):'<div class="card empty">🎉<p>Hôm nay không có bộ từ nào đến hạn ôn.<br>Vào thư viện để học hoặc luyện thêm nhé.</p></div>'}
 ${pdueCard()}<h2>Vocabulary Library</h2><div class="tiles"><a class="tile" onclick="go('lib')"><span>📚</span><b>Cambridge</b><small>Bộ từ của Mr. T</small></a><a class="tile" onclick="go('mine')"><span>⭐</span><b>My Vocabulary</b><small>${m.personal.filter(i=>!i.arch).length} từ</small></a></div>`}
function lib(){const ss=S().filter(s=>s.status==='pub'),bk=[...new Set(ss.map(s=>s.book))],m=me();
 return`<h1>Cambridge Vocabulary</h1>`+(bk.length?bk.map(b=>`<h2>${esc(b)}</h2>`+ss.filter(s=>s.book===b).map(s=>{const L=act(s),k=L.filter(i=>m.words[i.id]?.st==='m').length,p=m.prog[s.id],chip=!p?'Chưa học':!p.init?'Đang học':due(p)?'Đến hạn ôn':'Đã học xong';
 return`<div class="card set"><div style="flex:1;min-width:150px"><b>${esc(title(s).slice(b.length+3)||'Bộ từ')}</b> <span class="tag ${due(p)?'hot':''}">${chip}</span><div class="bar sm"><i style="width:${L.length?k/L.length*100:0}%"></i></div><div class="mut">${k}/${L.length} từ đã thuộc</div></div>${btnFor(s)}</div>`}).join('')).join(''):'<div class="card empty">📭<p>Mr. T chưa đăng bộ từ nào.</p></div>')}
function setPage(){const s=setOf(V.sid),p=P(s.id);return`<h1>${esc(title(s))}</h1><div class="card"><p class="mut">${act(s).length} từ · ${p.init?'Đã học xong lần đầu · Review '+p.rev+' · Lần ôn tới: '+fd(p.next):'Đang học lần đầu'}</p>
 <div class="row" style="justify-content:flex-start"><button onclick="openSet('${s.id}')">Flashcards</button>${due(p)?`<button onclick="startReview('${s.id}')">Review Now</button>`:''}<button class="p" onclick="startPractice('${s.id}')">Practice</button></div></div>`}
const PD=[1,3,7,12,18,24,30],gap=n=>n<=1?1:n<=7?PD[n-1]-PD[n-2]:30;
const pf=c=>c.front??c.word,pb=c=>c.back??[c.vi,c.pos,c.ex].filter(Boolean).join(' · '),isVi=t=>/[àáảãạăắằẳẵặâấầẩẫậèéẻẽẹêếềểễệìíỉĩịòóỏõọôốồổỗộơớờởỡợùúủũụưứừửữựỳýỷỹỵđ]/i.test(t);
const pdueN=()=>me().personal.filter(c=>!c.arch&&(c.next||0)<=Date.now()).length,curPC=()=>me().personal.find(x=>x.id===V.q[0]);
function pdueCard(){const n=pdueN();return n?`<div class="card set due"><div><b>Từ vựng riêng</b><div class="mut">${n} thẻ đến hạn</div></div><button onclick="startPR()">Review Now</button></div>`:''}
function mine(){const L=me().personal.filter(c=>!c.arch),n=pdueN(),e=V.ed;
 return`<h1>My Vocabulary</h1><div class="card"><label>Mặt trước</label><textarea id="pf" rows="2" placeholder="vd: overwhelming"></textarea><label>Mặt sau</label><textarea id="pb" rows="2" placeholder="vd: quá sức, choáng ngợp"></textarea><label>Câu ví dụ tiếng Anh <span class="mut">(không bắt buộc)</span></label><textarea id="px" rows="2" placeholder="vd: The workload was overwhelming."></textarea><p class="mut">Nút 🔊 chỉ đọc phần tiếng Anh. Có câu ví dụ thì Practice mới có thêm bài sắp xếp câu và điền từ.</p><button onclick="addCard()">Lưu thẻ</button></div>
 ${L.length?`<div class="card row"><div><b>Review</b><div class="mut">${n?n+' thẻ đến hạn ôn':'Chưa có thẻ nào đến hạn'}</div></div>${n?`<button onclick="startPR()">Review Now</button>`:'<span class="tag">Đã ôn xong</span>'}</div>
 <div class="card row"><div><b>Practice</b><div class="mut">${L.length} thẻ · làm bài bất cứ lúc nào</div></div><button class="p" onclick="startPractice('me')">Practice</button></div>`:''}

  :typed?`<button onclick="submitA()">Kiểm tra</button>${S1.tries>=3?` <button class="p" onclick="hintA()">💡 Gợi ý</button>`:''}${S1.hint>=nlet(T)?` <button class="g" onclick="giveUp()">Xem đáp án</button>`:''}`
  :`${tt==='order'?`<button onclick="checkO()" ${S1.pick.length?'':'disabled'}>Kiểm tra</button>`:''}${S1.tries>=3?` <button class="g" onclick="giveUp()">Xem đáp án</button>`:''}`;
 return`<div class="row top"><button class="g sm" onclick="go('${V.sid==='me'?'mine':'set'}',{sid:'${V.sid}'})">← Thoát</button><b>Practice</b><span class="mut">${V.i+1}/${V.qs.length}</span></div><div class="bar"><i style="width:${V.i/V.qs.length*100}%"></i></div>
 ${S1.done?'':`<div class="tm"><div class="bar ${r<3500?'low':''}"><i id="cdb" style="width:${r/TLIM*100}%"></i></div><b id="cdt">${Math.ceil(r/1000)}s</b></div>`}
 <div class="card q">${body}${S1.msg?`<div class="fb ${S1.done&&S1.ok?'good':'miss'}">${S1.msg}</div>`:''}${foot}</div>`}
function wrongMsg(S1,b='Xem đáp án'){S1.tries++;S1.msg=MSG_BAD[Math.random()*MSG_BAD.length|0]+(S1.tries>=3?' Bạn có thể bấm '+b+' nhé.':'')}
function submitA(){const q=V.qs[V.i],S1=V.st[V.i],a=$('#ans').value.trim();if(!a||S1.done)return;
 const ok=q.t==='ev'?vOk(a,q.it.vi):a.toLowerCase()===q.it.word.toLowerCase();
 if(ok)return prFin(true,a);S1.draft=a;wrongMsg(S1,'Gợi ý');render()}
function pickO(k){const q=V.qs[V.i],S1=V.st[V.i];if(S1.done||S1.bad.includes(k))return;if(q.opts[k]===q.ans)return prFin(true,q.opts[k]);S1.bad.push(k);wrongMsg(S1);render()}
function pickT(k){const S1=V.st[V.i];if(S1.done)return;S1.pick.push(k);render()}
function unpickT(k){const S1=V.st[V.i];if(S1.done)return;S1.pick=S1.pick.filter(x=>x!==k);render()}
function checkO(){const q=V.qs[V.i],S1=V.st[V.i];if(S1.done)return;const txt=S1.pick.map(k=>q.toks[k]).join(' '),a=norm(txt),b=norm(q.it.ex);
 if(a.length===b.length&&a.every((x,i)=>x===b[i]))return prFin(true,txt);wrongMsg(S1);render()}
function pickM(k){const q=V.qs[V.i],S1=V.st[V.i];if(S1.done||S1.fl.length)return;const c=q.cards[k];if(S1.mt.includes(c.k))return;
 if(S1.sel<0){S1.sel=k;return render()}if(S1.sel===k){S1.sel=-1;return render()}
 const a=q.cards[S1.sel];if(a.k===c.k&&a.t!==c.t){S1.mt.push(c.k);S1.sel=-1;if(S1.mt.length===q.pairs.length)return prFin(true,'');return render()}
 wrongMsg(S1);S1.fl=[S1.sel,k];S1.sel=-1;render();setTimeout(()=>{if(V.st[V.i]===S1){S1.fl=[];render()}},450)}
function prFin(ok,a){const q=V.qs[V.i],S1=V.st[V.i],w=W(q.it.id);S1.done=1;S1.ok=ok;S1.given=a;if(!S1.to){ok&&!S1.tries&&!S1.hint?w.c++:w.w++}
 S1.msg=(ok?'<b>Chính xác! 🎉</b>':'<b>Chưa đúng</b>')+`<div>Đáp án: <b>${esc(tgt(q))}</b></div>`;save();render()}
function hintA(){const S1=V.st[V.i];S1.hint=Math.min(S1.hint+1,nlet(tgt(V.qs[V.i])));render()}
function giveUp(){prFin(false,'')}
function prGo(d){V.i+=d;const S1=V.st[V.i];if(S1&&!S1.done)S1.dl=Date.now()+TLIM;render()}
function prDone(){clearInterval(PT);V.res=V.qs.map((q,i)=>({id:q.it.id,ok:!!V.st[i]?.ok,t:q.t}));if(!V.fin){V.fin=1;const p=P(V.sid),c=V.res.filter(r=>r.ok).length;p.pr++;if(V.sid!=='me')bump();lg('Hoàn thành Practice',V.sid,{q:V.res.length,c});save()}
 const c=V.res.filter(r=>r.ok).length,L=pitems(V.sid),bad=[...new Set(V.res.filter(r=>!r.ok).map(r=>L.find(i=>i.id===r.id)?.word))];
 return`<h1>Kết quả Practice</h1><div class="card"><div class="emo">${c/V.res.length>=.8?"🏆":c/V.res.length>=.5?"👍":"💪"}</div><div class="big">${Math.round(c/V.res.length*100)}%</div><p>${V.res.length} câu · ${c} đúng · ${V.res.length-c} sai</p><p class="mut">${bad.length?'Cần chú ý: <b>'+bad.map(esc).join(', ')+'</b>':'Không có từ nào sai 👏'}</p></div>
 <div class="row" style="justify-content:flex-start"><button onclick="startPractice('${V.sid}')">Luyện tiếp</button><button class="g" onclick="go('home')">Trang chủ</button></div>`}
/* ---------- teacher ---------- */
function tsets(){return`<div class="row"><h1>Bộ từ vựng</h1><button onclick="newSet()">+ Tạo bộ từ</button></div><div class="card"><b>Cập nhật cho học viên</b><p class="mut">Sau khi tạo hoặc sửa bộ từ: bấm "Tải sets.json", vào GitHub → Add file → Upload files → tải file này lên (ghi đè sets.json) → Commit. Sau 1–2 phút, học viên mở lại trang sẽ tự thấy bản mới, tiến độ học được giữ nguyên.</p><button onclick="exportSets()">Tải sets.json</button></div>`+(db.sets.length?db.sets.map(s=>`<div class="card row"><div><b>${esc(title(s))}</b> <span class="tag">${s.status==='pub'?'Đã đăng':'Nháp'}</span><div class="mut">${act(s).length} từ</div></div>
 <div><button class="g" onclick="go('tstat',{sid:'${s.id}'})">Học sinh</button> <button class="g" onclick="editSet('${s.id}')">Sửa</button></div></div>`).join(''):'<div class="card mut">Chưa có bộ từ nào. Bấm "Tạo bộ từ" để bắt đầu.</div>')}
function newSet(){go('tnew',{d:{id:uid(),book:'',test:'',passage:'',status:'draft',items:[],isNew:1},raw:''})}
function editSet(id){const s=JSON.parse(JSON.stringify(db.sets.find(x=>x.id===id)));go('tnew',{d:s,raw:''})}
function tnew(){const d=V.d;return`<h1>${d.isNew?'Tạo bộ từ vựng':'Sửa bộ từ vựng'}</h1><div class="card"><label>Cambridge Book</label><input value="${esc(d.book)}" placeholder="Cambridge IELTS 18" oninput="V.d.book=this.value">
 <div class="row"><div style="flex:1"><label>Test</label><input value="${esc(d.test)}" oninput="V.d.test=this.value"></div><div style="flex:1"><label>Reading Passage</label><input value="${esc(d.passage)}" oninput="V.d.passage=this.value"></div></div>
 <label>Danh sách từ (mỗi dòng một từ)</label><textarea rows="5" oninput="V.raw=this.value;cnt()" placeholder="enchanting&#10;capacity&#10;hoặc đã có sẵn: word | IPA | nghĩa | loại từ | ví dụ">${esc(V.raw)}</textarea><p class="mut" id="cnt"></p><p class="bad" id="msg"></p>
 <div class="row" style="justify-content:flex-start"><button onclick="genSet()">Generate Vocabulary</button><button class="g" onclick="addRows()">Thêm từ để nhập tay</button></div></div>
 ${d.items.length?`<div class="card wrap"><table><tr><th>Từ</th><th>IPA</th><th>Nghĩa</th><th>Loại</th><th>Ví dụ</th><th></th></tr>${d.items.map((x,i)=>x.arch?'':`<tr>${['word','ipa','vi','pos','ex'].map(k=>`<td><input value="${esc(x[k])}" oninput="V.d.items[${i}].${k}=this.value"></td>`).join('')}<td><button class="g" onclick="speak(V.d.items[${i}].word)">🔊</button><button class="g" onclick="regen(${i})">↻</button><button class="g" onclick="rm(${i})">✕</button></td></tr>`).join('')}</table></div>
 <div class="row" style="justify-content:flex-start"><button class="g" onclick="saveSet('draft')">Lưu nháp</button><button onclick="saveSet('pub')">Publish</button></div>`:''}`}
function words(){const seen=new Set(),out=[];(V.raw||'').split('\n').map(w=>w.trim()).filter(Boolean).forEach(w=>{const k=w.toLowerCase();if(!/^[A-Za-z][A-Za-z '-]*$/.test(w)||seen.has(k)||V.d.items.some(i=>!i.arch&&i.word.toLowerCase()===k))return;seen.add(k);out.push(w)});return out}
function addRows(){words().forEach(w=>V.d.items.push({id:uid(),word:w,ipa:'',vi:'',pos:'',ex:''}));V.raw='';render()}
const msg=t=>{const e=$('#msg');if(e)e.textContent=t};
function piped(){const seen=new Set();return(V.raw||'').split('\n').filter(l=>l.includes('|')).map(l=>l.split('|').map(x=>x.trim())).filter(a=>a[0]&&/^[A-Za-z][A-Za-z '-]*$/.test(a[0])&&a[2]).filter(a=>{const k=a[0].toLowerCase();if(seen.has(k)||V.d.items.some(i=>!i.arch&&i.word.toLowerCase()===k))return false;seen.add(k);return true}).map(a=>({id:uid(),word:a[0],ipa:a[1]||'',vi:a[2],pos:a[3]||'',ex:a[4]||''}))}
function cnt(){const e=$('#cnt');if(e)e.textContent=(words().length+piped().length)+' từ hợp lệ'}
async function genSet(){const w=words(),pp=piped();if(!w.length&&!pp.length)return msg('Không có từ mới hợp lệ (dòng trống hoặc từ trùng đã bị loại).');
 try{msg('');pp.forEach(x=>V.d.items.push(x));let r=[];if(w.length){toast('Đang tạo '+w.length+' từ…');r=await ai(w);r.forEach(x=>V.d.items.push(x))}V.raw='';render();
 const miss=r.filter(x=>!x.ipa||!x.vi||!x.pos||!x.ex).length;if(miss)msg(miss+' từ còn thiếu thông tin (IPA, nghĩa, loại từ hoặc ví dụ). Hãy điền tay vào ô trống rồi mới Publish.');else toast('Xem lại rồi Publish')}
 catch(e){msg('Lỗi: '+(e.message==='Failed to fetch'?'không kết nối được, kiểm tra mạng.':e.message))}}
function exportSets(){const b=new Blob([JSON.stringify(db.sets)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sets.json';a.click()}
async function pull(){try{const r=await fetch('sets.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();if(!Array.isArray(j))return;db.remote=j;if(db.role==='t'&&!db.sets.length)db.sets=JSON.parse(JSON.stringify(j));save();if(['home','lib','set','tsets'].includes(V.p))render()}catch{}}
async function regen(i){try{const x=(await ai([V.d.items[i].word]))[0];V.d.items[i]={...x,id:V.d.items[i].id};render()}catch(e){toast(e.message)}}
function rm(i){const x=V.d.items[i];if(!confirm('Xóa từ "'+x.word+'"?'))return;V.d.isNew?V.d.items.splice(i,1):x.arch=true;render()}
function saveSet(st){const d=V.d;if(!d.book.trim())return toast('Nhập tên Cambridge book');if(st==='pub'&&act(d).some(i=>!i.word||!i.vi||!i.ex))return toast('Mỗi từ cần có nghĩa và câu ví dụ');
 if(st==='pub'&&!confirm('Bạn đã kiểm tra '+act(d).length+' từ chưa? Sau khi Publish, học sinh sẽ thấy ngay.'))return;d.status=st;delete d.isNew;const k=db.sets.findIndex(s=>s.id===d.id);k<0?db.sets.push(d):db.sets[k]=d;save();toast(st==='pub'?'Published':'Đã lưu nháp');go('tsets')}
function tstud(){const q=(V.q||'').toLowerCase(),L=Object.entries(db.students).filter(([k,s])=>!q||k.includes(q));
 return`<h1>Học sinh</h1><input placeholder="Tìm theo tên hoặc lớp" value="${esc(V.q||'')}" oninput="V.q=this.value;render();$('main input').focus()"><div class="card wrap"><table><tr><th>Tên</th><th>Lớp</th><th>Đăng nhập đầu</th><th>Hoạt động cuối</th><th>Số bộ</th></tr>
 ${L.map(([k,s])=>`<tr><td><a class="lnk" onclick="go('tone',{k:'${esc(k).replace(/'/g,'')}'})">${esc(s.name)}</a></td><td>${esc(s.cls)}</td><td>${fd(s.first)}</td><td>${fd(s.log.at(-1)?.at||s.last)}</td><td>${Object.keys(s.prog).filter(x=>x!=='me').length}</td></tr>`).join('')||'<tr><td colspan=5 class="mut">Chưa có học sinh (chỉ thấy học sinh đã đăng nhập trên thiết bị này)</td></tr>'}</table></div>`}
function tone(){const s=db.students[V.k];return`<h1>${esc(s.name)} <span class="tag">${esc(s.cls)}</span></h1><p class="mut">Đăng nhập đầu: ${fd(s.first)} · Streak: ${s.day===dk(new Date())||s.day===dk(new Date(Date.now()-D))?s.streak:0}</p>
 <div class="card wrap"><table><tr><th>Bộ từ</th><th>Trạng thái</th><th>Review</th><th>Practice</th><th>Ôn tới</th></tr>${db.sets.filter(x=>s.prog[x.id]).map(x=>{const p=s.prog[x.id];return`<tr><td>${esc(title(x))}</td><td>${p.init?'Hoàn thành':'Đang học'}</td><td>${p.rev}</td><td>${p.pr}</td><td>${fd(p.next)}</td></tr>`}).join('')}</table></div>
 <h2>Lịch sử hoạt động</h2><div class="card">${[...s.log].reverse().map(l=>`<div class="mut">${fd(l.at)} — ${esc(l.t)}: ${esc(l.sid==='me'?'Từ vựng cá nhân':title(db.sets.find(x=>x.id===l.sid)||{book:'(đã xóa)'}))}</div>`).join('')||'<span class="mut">Chưa có</span>'}</div>
 <h2>Từ vựng cá nhân (${s.personal.filter(i=>!i.arch).length})</h2><div class="card">${s.personal.filter(i=>!i.arch).map(i=>`<div>${esc(i.front??i.word)} — <span class="mut">${esc(i.back??i.vi)}</span></div>`).join('')||'<span class="mut">Chưa có</span>'}</div>`}
function tstat(){const s=db.sets.find(x=>x.id===V.sid);return`<h1>${esc(title(s))}</h1><div class="card wrap"><table><tr><th>Học sinh</th><th>Học lần đầu</th><th>Review</th><th>Practice</th><th>Tương tác đầu</th><th>Gần nhất</th><th>Ôn tới</th></tr>
 ${Object.values(db.students).map(st=>{const p=st.prog[s.id];return`<tr><td>${esc(st.name)} (${esc(st.cls)})</td><td>${!p?'Chưa học':p.init?'Hoàn thành':'Đang học'}</td><td>${p?.rev||0}</td><td>${p?.pr||0}</td><td>${fd(p?.first)}</td><td>${fd(st.log.filter(l=>l.sid===s.id).at(-1)?.at)}</td><td>${fd(p?.next)}</td></tr>`}).join('')||'<tr><td colspan=7 class="mut">Chưa có học sinh</td></tr>'}</table></div>`}
/* ---------- shell ---------- */
function render(){const t=db.role==='t',s=db.role==='s',on=(...p)=>p.includes(V.p)?'on':'',nav=$('#nav');nav.className=s?'st':'';
 nav.innerHTML=s?`<a class="${on('home','set','fc','pr','done')}" onclick="go('home')"><i>🏠</i>Home</a><a class="${on('lib')}" onclick="go('lib')"><i>📚</i>Library</a><a class="${on('mine')}" onclick="go('mine')"><i>⭐</i>My Vocabulary</a>`:t?`<a class="${on('tsets','tnew','tstat')}" onclick="go('tsets')">Bộ từ</a><a class="${on('tstud','tone')}" onclick="go('tstud')">Học sinh</a>`:'';
 $('#hx').innerHTML=db.role?`<button class="g sm" onclick="accent()">🔊 ${db.acc==='en-US'?'Mỹ':'Anh'}</button><button class="g sm" onclick="out()">Thoát</button>`:'';
 const guard=(r,f)=>db.role===r?f():loginView();
 const v={login:loginView,home:()=>guard('s',home),lib:()=>guard('s',lib),set:()=>guard('s',setPage),mine:()=>guard('s',mine),fc:()=>guard('s',fc),done:()=>guard('s',doneView),pr:()=>guard('s',pr),pcr:()=>guard('s',pcr),
 tsets:()=>guard('t',tsets),tnew:()=>guard('t',tnew),tstud:()=>guard('t',tstud),tone:()=>guard('t',tone),tstat:()=>guard('t',tstat)}[V.p];
 $('#app').innerHTML=v();cnt();const a=$('#ans');if(a&&!a.disabled)a.focus()}
function loginView(){return`<div class="login"><div class="mascot">📘</div><h1>IELTS Vocab</h1><p class="mut">Học từ vựng IELTS mỗi ngày: flashcard, luyện tập và lịch ôn thông minh giúp bạn nhớ lâu hơn.</p>
 <div class="card"><label>Tên tiếng Anh đầy đủ</label><input id="n" placeholder="Alex Nguyen" autocomplete="off"><label>Lớp</label><input id="c" placeholder="IELTS Foundation 01" onkeydown="if(event.key==='Enter')login()"><p><button class="wide" onclick="login()">Start Learning</button></p></div>
 </div>`}
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
 if(V.p==='fc'){if(e.key===' '||e.key==='Enter'){e.preventDefault();flipCard()}else if(V.rv&&'123'.includes(e.key)&&e.key)mark('npm'[e.key-1]);else if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1)}
 else if(V.p==='pr'&&V.st[V.i]?.done&&e.key==='Enter'){e.preventDefault();prGo(1)}});
if(db.role==='t')db.role=null;if(db.role==='s'&&!me())db.role=null;V.p=db.role==='s'?'home':db.role==='t'?'tsets':'login';render();pull();document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
</script></body></html>
