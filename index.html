<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Từ Vựng Cambridge IELTS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap">
<style>
:root{--bg:#f2f5fa;--card:#fff;--ink:#14213d;--mute:#5b6784;--line:#d9e0ee;--acc:#2f6fed;--accink:#fff;--ok:#1b8a5a;--bad:#d64545;--mid:#c27a0a;--hl:#ffe07a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1626;--card:#18223a;--ink:#eef2fb;--mute:#9aa6c4;--line:#2a3757;--acc:#6b9bff;--accink:#0f1626;--ok:#4cc790;--bad:#ff7a7a;--mid:#f0b34a;--hl:#6b5a14}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1626;--card:#18223a;--ink:#eef2fb;--mute:#9aa6c4;--line:#2a3757;--acc:#6b9bff;--accink:#0f1626;--ok:#4cc790;--bad:#ff7a7a;--mid:#f0b34a;--hl:#6b5a14}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Be Vietnam Pro','Segoe UI',system-ui,'Noto Sans',sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:20px;margin:0 0 4px;line-height:1.3}
.sub,.pt,.hint{color:var(--mute);font-size:14px}
.sub{margin:0 0 16px}.pt{margin:8px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px;margin-bottom:12px}
label{display:block;font-weight:500;margin-bottom:12px}
input{display:block;width:100%;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink)}
button{font:inherit;color:var(--ink)}
button:focus-visible,input:focus-visible,.card:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:500;cursor:pointer;width:100%}
.btn.main{background:var(--acc);border-color:var(--acc);color:var(--accink);font-weight:700}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;font-size:14px;cursor:pointer;padding:6px 0;width:auto}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:0 0 8px}
.chips{display:flex;gap:6px;margin:14px 0}
.chip{flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:6px 2px;font-size:12px;color:var(--mute)}
.chip.on{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.big{font-size:20px;font-weight:700;margin:0 0 8px}
.sent{font-size:22px;font-weight:500;line-height:1.5;margin:0 0 12px}
mark{background:var(--hl);color:inherit;border-radius:4px;padding:0 3px}
.word{font-size:34px;font-weight:700;line-height:1.15;margin:0}
.ipa{font-size:20px;color:var(--acc);margin:4px 0 0;font-family:'Noto Sans','Segoe UI','Lucida Sans Unicode',sans-serif}
.mean{font-size:19px;font-weight:500;margin:12px 0}
.vi{color:var(--mute);margin:6px 0 0}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spk{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:19px;cursor:pointer;flex:none}
.spk.on{background:var(--hl)}
.fcard{cursor:pointer;min-height:200px}
.act{display:flex;gap:8px}
.act .btn{padding:13px 4px}
.no{border-color:var(--bad);color:var(--bad)}.mid{border-color:var(--mid);color:var(--mid)}.yes{border-color:var(--ok);color:var(--ok)}
.opt{display:block;text-align:left;margin-bottom:8px}
.opt.right{border-color:var(--ok);background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad);color:#fff}
.li{padding:8px 0;border-bottom:1px solid var(--line)}
.set{display:block;text-align:left;margin-bottom:10px;border-left-width:8px;padding:14px}
.set b{display:block;font-size:17px}.set span{display:block;font-size:14px;color:var(--mute)}
.set .st{font-weight:700;margin-top:4px}
.set.late{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}.set.late .st{color:var(--bad)}
.set.now{border-left-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card))}.set.now .st{color:var(--acc)}
.set.wait{border-left-color:var(--line)}
.set.done{border-left-color:var(--ok)}.set.done .st{color:var(--ok)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="app"></main>
<script>

["take turns","collocation","/teɪk tɜːnz/","thay phiên nhau, lần lượt","The children learn to take turns when they play board games.","Trẻ học cách thay phiên nhau khi chơi các trò chơi cờ bàn.","take turns"],
["boss somebody around","phrasal verb","/bɒs ˈsʌmbədi əˈraʊnd/","sai khiến, ra lệnh cho ai","My older sister likes to boss me around.","Chị gái tôi thích sai khiến tôi.","boss me around"],
["settle down","phrasal verb","/ˈsetl daʊn/","ổn định, yên vị để làm việc gì","After lunch, the class settled down to read quietly.","Sau bữa trưa, cả lớp yên vị và đọc sách trong im lặng.","settled down"],

["base policies on evidence","collocation","/beɪs ˈpɒləsiz ɒn ˈevɪdəns/","xây dựng chính sách dựa trên bằng chứng","Governments should base their policies on evidence.","Chính phủ nên xây dựng chính sách dựa trên bằng chứng.","base their policies on evidence"],
["have an impact on","collocation","/hæv ən ˈɪmpækt ɒn/","có tác động đến","Screen time can have an impact on children’s sleep.","Thời gian dùng màn hình có thể ảnh hưởng đến giấc ngủ của trẻ.","have an impact on"],
["mindful of","adj","/ˈmaɪn(d)fl əv/","lưu tâm, ý thức được","Teachers should be mindful of each child’s needs.","Giáo viên nên lưu tâm đến nhu cầu của từng em.","mindful of"],
["a decline in","collocation","/ə dɪˈklaɪn ɪn/","sự suy giảm về","There has been a sharp decline in outdoor play.","Việc chơi ngoài trời đã giảm mạnh.","decline in"],
["curtail","v","/kɜːˈteɪl/","hạn chế, cắt giảm","Heavy traffic curtails children’s freedom to play outside.","Giao thông đông đúc hạn chế quyền tự do chơi ngoài trời của trẻ.","curtails"],
["intervene","v","/ˌɪntəˈviːn/","can thiệp","Researchers should not intervene while children are playing.","Các nhà nghiên cứu không nên can thiệp khi trẻ đang chơi.","intervene"],
["a key predictor of","collocation","/ə kiː prɪˈdɪktə(r) əv/","yếu tố dự báo chính của","Self-control is a key predictor of academic success.","Khả năng tự kiểm soát là yếu tố dự báo chính cho thành tích học tập.","a key predictor of"],
["play a role in","collocation","/pleɪ ə rəʊl ɪn/","đóng vai trò trong","Imagination plays a role in how children learn to solve problems.","Trí tưởng tượng đóng vai trò trong việc trẻ học cách giải quyết vấn đề.","plays a role in"],
["underpin","v","/ˌʌndəˈpɪn/","làm nền tảng cho, củng cố","Strong social skills underpin success at school.","Kỹ năng xã hội tốt là nền tảng cho thành công ở trường.","underpin"],
["facilitate","v","/fəˈsɪlɪteɪt/","tạo điều kiện, thúc đẩy","Group games can facilitate the development of language skills.","Các trò chơi nhóm có thể thúc đẩy sự phát triển kỹ năng ngôn ngữ.","facilitate"],
["lose sight of","idiom","/luːz saɪt əv/","quên mất, không còn chú ý đến điều quan trọng","In the rush to pass exams, schools may lose sight of children’s well-being.","Trong cuộc đua thi cử, các trường có thể quên mất sức khỏe tinh thần của trẻ.","lose sight of"],
["hotly debated","collocation","/ˈhɒtli dɪˈbeɪtɪd/","bị tranh luận sôi nổi","The ideal age to start school is a hotly debated topic.","Độ tuổi lý tưởng để bắt đầu đi học là chủ đề tranh luận sôi nổi.","hotly debated"],
["extol the virtues of","idiom","/ɪkˈstɒl ðə ˈvɜːtʃuːz əv/","hết lời ca ngợi ưu điểm của","Many educators extol the virtues of learning through play.","Nhiều nhà giáo dục hết lời ca ngợi ưu điểm của việc học qua vui chơi.","extol the virtues of"],
["a quiet backwater","idiom","/ə ˈkwaɪət ˈbækwɔːtə(r)/","lĩnh vực yên ắng, ít được chú ý","For years, early-years education was a quiet backwater of research.","Trong nhiều năm, giáo dục mầm non là một lĩnh vực yên ắng ít được nghiên cứu.","a quiet backwater"],
["repercussion","n","/ˌriːpəˈkʌʃn/","hệ quả, tác động lâu dài","Skipping play may have serious repercussions for a child’s development.","Việc bỏ qua vui chơi có thể gây hệ quả nghiêm trọng cho sự phát triển của trẻ.","repercussions"],
["trivial","adj","/ˈtrɪviəl/","tầm thường, không quan trọng","Some adults dismiss play as trivial.","Một số người lớn gạt vui chơi đi như chuyện tầm thường.","trivial"]
].map(a=>({w:a[0],p:a[1],i:a[2],m:a[3],e:a[4],v:a[5],h:a[6]}))},
{id:"henderson",title:"Alexander Henderson",words:[
["give up","phrasal verb","/ɡɪv ʌp/","từ bỏ","He gave up his job to study full-time.","Anh ấy bỏ việc để học toàn thời gian.","gave up"],
["take up","phrasal verb","/teɪk ʌp/","bắt đầu theo đuổi (sở thích, môn mới)","She took up painting after she retired.","Bà bắt đầu học vẽ sau khi nghỉ hưu.","took up"],
["settle in","phrasal verb","/ˈsetl ɪn/","ổn định cuộc sống ở nơi mới","It took us a few months to settle in after moving to the city.","Chúng tôi mất vài tháng để ổn định cuộc sống sau khi chuyển lên thành phố.","settle in"],
["emigrate","v","/ˈemɪɡreɪt/","di cư ra nước ngoài","Thousands of people emigrate every year in search of better jobs.","Mỗi năm có hàng nghìn người di cư ra nước ngoài để tìm việc tốt hơn.","emigrate"],
["make a living","idiom","/meɪk ə ˈlɪvɪŋ/","kiếm sống","Many artists struggle to make a living from their work.","Nhiều nghệ sĩ gặp khó khăn khi kiếm sống bằng nghề của mình.","make a living"],
["be fond of","collocation","/bi ˈfɒnd əv/","thích, yêu thích","He is very fond of walking in the mountains.","Anh ấy rất thích đi bộ trên núi.","fond of"],
["in spite of","phrase","/ɪn ˈspaɪt əv/","mặc dù, bất chấp","In spite of the heavy rain, the match went ahead.","Bất chấp mưa lớn, trận đấu vẫn diễn ra.","In spite of"],
["time-consuming","adj","/ˈtaɪm kənˌsjuːmɪŋ/","tốn thời gian","Preparing handmade prints is a time-consuming process.","Chuẩn bị các bản in thủ công là một quá trình tốn thời gian.","time-consuming"],
["on the outskirts of","phrase","/ɒn ði ˈaʊtskɜːts əv/","ở vùng ngoại ô của","Our school is on the outskirts of the city.","Trường chúng tôi nằm ở vùng ngoại ô thành phố.","on the outskirts of"],
["specialise in","collocation","/ˈspeʃəlaɪz ɪn/","chuyên về","The studio specialises in portrait photography.","Studio này chuyên về nhiếp ảnh chân dung.","specialises in"],
["be noted for","collocation","/bi ˈnəʊtɪd fɔː(r)/","nổi tiếng về","The region is noted for its dramatic scenery.","Vùng này nổi tiếng với cảnh quan ngoạn mục.","noted for"],
["demand for","collocation","/dɪˈmɑːnd fɔː(r)/","nhu cầu về","There is growing demand for locally grown food.","Nhu cầu về thực phẩm trồng tại địa phương ngày càng tăng.","demand for"],
["cater to","phrasal verb","/ˈkeɪtə tuː/","phục vụ, đáp ứng nhu cầu của","Many shops cater to tourists who want cheap souvenirs.","Nhiều cửa hàng phục vụ du khách muốn mua quà lưu niệm giá rẻ.","cater to"],
["limited circulation","collocation","/ˈlɪmɪtɪd ˌsɜːkjəˈleɪʃn/","số lượng phát hành hạn chế","The magazine has a limited circulation outside the capital.","Tạp chí này phát hành hạn chế ngoài thủ đô.","limited circulation"],
["vary significantly","collocation","/ˈveəri sɪɡˈnɪfɪkəntli/","khác nhau đáng kể","Prices vary significantly from one region to another.","Giá cả khác nhau đáng kể giữa các vùng.","vary significantly"],
["document","v","/ˈdɒkjumənt/","ghi lại, tư liệu hóa","She spent years documenting the lives of fishing communities.","Cô ấy dành nhiều năm ghi lại cuộc sống của các cộng đồng ngư dân.","documenting"],
["principal","adj","/ˈprɪnsəpl/","chính, chủ yếu","Tourism is the principal source of income for the island.","Du lịch là nguồn thu nhập chính của hòn đảo.","principal"],
["evaluate","v","/ɪˈvæljueɪt/","đánh giá","Teachers evaluate students’ progress at the end of each term.","Giáo viên đánh giá tiến bộ của học sinh vào cuối mỗi học kỳ.","evaluate"],
["prospect","n","/ˈprɒspekt/","viễn cảnh, triển vọng","She was excited by the prospect of living abroad.","Cô ấy rất hào hứng với viễn cảnh được sống ở nước ngoài.","prospect"],
["meet with success","collocation","/miːt wɪð səkˈses/","đạt được thành công","The new product met with success in overseas markets.","Sản phẩm mới đã thành công ở thị trường nước ngoài.","met with success"],
["apprenticeship","n","/əˈprentɪsʃɪp/","thời gian học việc","He began a three-year apprenticeship as a carpenter.","Anh ấy bắt đầu ba năm học việc làm thợ mộc.","apprenticeship"],
["commission","n","/kəˈmɪʃn/","đơn đặt hàng thực hiện một công trình hay tác phẩm","The artist received a commission to paint the mayor’s portrait.","Nghệ sĩ nhận được đơn đặt hàng vẽ chân dung thị trưởng.","commission"],
["depict","v","/dɪˈpɪkt/","miêu tả, khắc họa","The painting depicts a village market at dawn.","Bức tranh khắc họa một khu chợ làng lúc bình minh.","depicts"],
["wilderness","n","/ˈwɪldənəs/","vùng hoang dã","They spent two weeks hiking in the wilderness.","Họ đi bộ đường dài hai tuần trong vùng hoang dã.","wilderness"]
].map(a=>({w:a[0],p:a[1],i:a[2],m:a[3],e:a[4],v:a[5],h:a[6]}))}];
let W=[],SET=null;
const GAP=[1,2,4,7,7,9]; // ngày chờ sau lần review 1..6 → mốc +1, +3, +7, +14, +21, +30
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return iso(d)};
const fmt=s=>s.split("-").reverse().join("/");
const getLS=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const setLS=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const key=u=>"vocab7:"+(u.name+"|"+u.en).toLowerCase().replace(/\s+/g," ").trim();
let P=null,S={};
const save=()=>setLS(key(P),JSON.stringify(P));
const D=id=>P.sets[id]||(P.sets[id]=[]);
const dueOf=id=>{const d=D(id),n=d.length;return n&&n<7?addDays(d[n-1],GAP[n-1]):today()};
const hl=w=>{const s=esc(w.e),t=w.h||w.w;let r=new RegExp(t,"i");if(!r.test(s))r=new RegExp("\\b("+t.split(" ")[0]+"\\w*)","i");return s.replace(r,m=>"<mark>"+m+"</mark>")};
const tts="speechSynthesis" in window;let voice=null;
function pick(){if(!tts)return;const v=speechSynthesis.getVoices();voice=v.find(x=>x.lang==="en-GB")||v.find(x=>x.lang&&x.lang.startsWith("en"))||null}
if(tts){pick();speechSynthesis.onvoiceschanged=pick}
function say(t,b){if(!tts)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";if(voice)u.voice=voice;u.rate=.9;
 document.querySelectorAll(".spk.on").forEach(x=>x.classList.remove("on"));
 if(b){b.classList.add("on");u.onend=u.onerror=()=>b.classList.remove("on")}speechSynthesis.speak(u)}
const back=()=>`<button class="link" id="bk">← Về trang chính</button>`;
const bindBack=()=>{const b=$("#bk");if(b)b.onclick=home};

function login(){
 app.innerHTML=`<h1>Từ Vựng Cambridge IELTS</h1><p class="sub">Nhập tên để app lưu tiến độ học của bạn.</p>
 <div class="card"><label>Họ và tên<input id="nm" autocomplete="name"></label><label>Tên tiếng Anh<input id="en"></label><p class="err" id="er"></p><button class="btn main" id="go">Vào học</button></div>`;
 $("#go").onclick=()=>{const name=$("#nm").value.trim(),en=$("#en").value.trim();
  if(!name||!en){$("#er").textContent="Hãy nhập cả họ tên và tên tiếng Anh.";return}
  setLS("vocab7:last",JSON.stringify({name,en}));enter({name,en})};
}
function enter(u){let p=null;try{p=JSON.parse(getLS(key(u)))}catch(e){}P=p||{name:u.name,en:u.en};P.sets=P.sets||{play:P.dates||[]};home()}

function stat(id){const n=D(id).length;if(n>=7)return{k:"done",t:"Đã hoàn thành 7/7"};
 const d=dueOf(id),t=today();if(!n)return{k:"now",t:"Bộ mới · học ngay"};
 const diff=Math.round((new Date(d+"T00:00:00")-new Date(t+"T00:00:00"))/864e5);
 if(diff<0)return{k:"late",t:"Lỡ hẹn "+(-diff)+" ngày · ôn ngay"};
 if(diff===0)return{k:"now",t:"Đến hạn hôm nay · ôn ngay"};
 return{k:"wait",t:"Ôn tiếp ngày "+fmt(d)+" (còn "+diff+" ngày)"}}
function home(){
 const order={late:0,now:1,wait:2,done:3};
 const L=SETS.map(s=>({s,st:stat(s.id)})).sort((a,b)=>order[a.st.k]-order[b.st.k]);
 app.innerHTML=`<h1>Từ Vựng Cambridge IELTS</h1><p class="sub">Xin chào, ${esc(P.name)} (${esc(P.en)}). Chọn bộ từ để học. Bộ cần ôn gấp nhất nằm trên cùng.</p>`+
 L.map(x=>`<button class="btn set ${x.st.k}" data-id="${x.s.id}"><b>${esc(x.s.title)}</b><span>Lần ${D(x.s.id).length}/7 · ${x.s.words.length} mục</span><span class="st">${x.st.t}</span></button>`).join("")+
 `<button class="link" id="sw2">Đổi người học</button>`;
 document.querySelectorAll(".set").forEach(b=>b.onclick=()=>setHome(b.dataset.id));
 $("#sw2").onclick=()=>{setLS("vocab7:last","");login()};
}
function setHome(id){SET=SETS.find(s=>s.id===id);W=SET.words;
 const n=D(id).length,d=dueOf(id),t=today();let st;
 if(n>=7)st=`<p class="big">🎉 Bạn đã hoàn thành 7/7 lần review.</p><p class="sub">Chúc mừng, bộ từ này đã vào trí nhớ dài hạn.</p>`;
 else if(d>t)st=`<p class="big">Đã xong lần ${n}/7</p><p>Lần review tiếp theo (lần ${n+1}): <b>${fmt(d)}</b></p><button class="btn main" disabled>Chưa đến ngày ôn</button>`;
 else st=`<p class="big">${n?"Đến ngày ôn rồi":"Bắt đầu học bộ từ"}</p><p class="sub">Lần review ${n+1}/7 · ${W.length} mục</p><button class="btn main" id="st">Bắt đầu lần review ${n+1}</button>`;
 let chips="";for(let i=0;i<7;i++)chips+=`<div class="chip${D(SET.id)[i]?" on":""}">${D(SET.id)[i]?fmt(D(SET.id)[i]).slice(0,5):"Lần "+(i+1)}</div>`;
 app.innerHTML=`<button class="link" id="bk">← Tất cả bộ từ</button><h1>${esc(SET.title)}</h1><p class="sub">${SET.words.length} từ và cụm từ</p>
 <div class="chips">${chips}</div><div class="card">${st}</div>`;
 if($("#st"))$("#st").onclick=()=>{S={q:W.map((_,i)=>i),must:[],hist:[]};study()};
 bindBack();
}

function study(){
 if(!S.q.length)return test();
 const w=W[S.q[0]];
 app.innerHTML=`${back()}<div class="pt">Còn ${S.q.length} thẻ trong lượt này</div><button class="link" id="un" ${S.hist.length?"":"hidden"}>↶ Hoàn tác thẻ vừa chấm</button>
 <div class="card fcard" id="cd" tabindex="0" role="button" aria-label="Lật thẻ">
 <div id="fr"><p class="word" style="margin-bottom:12px">${esc(w.w)}</p><button class="spk" id="s1" aria-label="Nghe phát âm">🔊</button><p class="hint">Chạm vào thẻ để lật</p></div>
 <div id="bc" hidden><div class="top"><h2 class="word">${esc(w.w)}</h2><button class="spk" id="s2" aria-label="Nghe từ">🔊</button><span class="hint">(${w.p})</span></div>
 <p class="ipa">${esc(w.i)}</p><p class="mean">${esc(w.m)}</p><p class="sent" style="font-size:17px">${hl(w)}</p><p class="vi">${esc(w.v)}</p><button class="spk" id="s3" aria-label="Nghe câu">🔊</button></div></div>
 <div class="act" id="ra" hidden><button class="btn no" data-r="n">Chưa thuộc</button><button class="btn mid" data-r="m">Hơi nhớ</button><button class="btn yes" data-r="k">Đã thuộc</button></div>`;
 bindBack();
 $("#un").onclick=()=>{S.q=S.hist.pop();study()};let f=false;
 const flip=()=>{if(f)return;f=true;$("#fr").hidden=true;$("#bc").hidden=false;$("#ra").hidden=false;say(w.w,$("#s2"))};
 $("#cd").onclick=flip;$("#cd").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip()}};
 $("#s1").onclick=e=>{e.stopPropagation();say(w.w,$("#s1"))};
 $("#s2").onclick=e=>{e.stopPropagation();say(w.w,$("#s2"))};
 $("#s3").onclick=e=>{e.stopPropagation();say(w.e,$("#s3"))};
 document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
  S.hist.push(S.q.slice());const i=S.q.shift(),r=b.dataset.r;
  if(r==="n")S.q.splice(Math.min(3,S.q.length),0,i);
  if(r==="m")S.q.splice(Math.min(7,S.q.length),0,i);
  study()});
}

function test(){
 const rest=shuf(W.map((_,i)=>i).filter(i=>!S.must.includes(i)));
 S.tq=S.must.concat(rest).slice(0,10);S.ti=0;S.wrong=[];S.score=0;ask();
}
function ask(){
 if(S.ti>=S.tq.length)return fin();
 const i=S.tq[S.ti],w=W[i];
 const opts=shuf([i,...shuf(W.map((_,k)=>k).filter(k=>k!==i)).slice(0,3)]);
 app.innerHTML=`${back()}<div class="pt">Kiểm tra nhanh · câu ${S.ti+1}/${S.tq.length}</div>
 <div class="card"><p class="hint">Chọn nghĩa đúng của từ hoặc cụm từ:</p><div class="top"><h2 class="word">${esc(w.w)}</h2><button class="spk" id="sp" aria-label="Nghe từ">🔊</button></div></div>
 ${opts.map(k=>`<button class="btn opt" data-k="${k}">${esc(W[k].m)}</button>`).join("")}<button class="btn main" id="nx" hidden>Tiếp tục</button>`;
 bindBack();$("#sp").onclick=()=>say(w.w,$("#sp"));say(w.w,$("#sp"));
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
  const k=+b.dataset.k;
  document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.k===i)x.classList.add("right")});
  if(k===i)S.score++;else{b.classList.add("wrong");S.wrong.push(i)}
  $("#nx").hidden=false;$("#nx").focus()});
 $("#nx").onclick=()=>{S.ti++;ask()};
}
function fin(){
 const ok=S.score>=8,total=S.tq.length;
 const wl=S.wrong.map(i=>`<div class="li"><b>${esc(W[i].w)}</b> ${esc(W[i].i)} · ${esc(W[i].m)}</div>`).join("");
 if(ok){
  D(SET.id).push(today());save();
  const n=D(SET.id).length;
  app.innerHTML=`<div class="card"><p class="big">✅ Tính 1 lần review!</p><p>Bạn đã hoàn thành <b>lần ${n}/7</b> (đúng ${S.score}/${total} câu kiểm tra).</p>
  ${n<7?`<p>Ngày ôn tiếp theo: <b>${fmt(dueOf(SET.id))}</b>. Ôn đúng hẹn để nhớ lâu hơn nhé.</p>`:`<p class="big">🎉 Bạn đã hoàn thành đủ 7 lần review!</p>`}
  ${wl?`<p class="hint">Từ cần chú ý thêm:</p>${wl}`:""}</div><button class="btn main" id="hm">Về trang chính</button>`;
  $("#hm").onclick=home;
 }else{
  app.innerHTML=`<div class="card"><p class="big">Chưa tính lần review này</p><p>Bạn đúng ${S.score}/${total} câu, cần ít nhất 8 câu. Học lại các từ sai rồi kiểm tra lại nhé.</p>${wl}</div><button class="btn main" id="re">Học lại các từ sai</button>`;
  $("#re").onclick=()=>{S.q=S.wrong.slice();S.must=S.wrong.slice();study()};
 }
}
let last=null;try{last=JSON.parse(getLS("vocab7:last"))}catch(e){}
if(last&&last.name&&last.en)enter(last);else login();
</script>
</body>
</html>
