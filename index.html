<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IELTS Vocab</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5fd;--ink:#1f2347;--mut:#6c7194;--pri:#5848e5;--pd:#4337bd;--soft:#ecebff;--line:#e4e6f5;--sun:#ffb21a;--ok:#1fb26b;--bad:#ff5a6e;--sh:0 6px 20px rgba(60,60,140,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Nunito","Noto Sans","Segoe UI",system-ui,sans-serif}
h1,h2,.logo,.w,.big,.vi,.fire b{font-family:"Nunito","Noto Sans",system-ui,sans-serif;font-weight:800}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.logo{font-size:20px;color:var(--pri)}#hx{display:flex;gap:6px}nav{display:flex;gap:4px;flex:1;justify-content:center}
nav a{cursor:pointer;padding:7px 14px;border-radius:99px;color:var(--mut);font-weight:800;display:flex;gap:6px;align-items:center}nav a i{font-style:normal}nav a.on{background:var(--soft);color:var(--pri)}
main{max-width:720px;margin:0 auto;padding:22px 16px 90px}h1{font-size:28px;margin:.2em 0 .4em}h2{font-size:19px;margin:1.6em 0 .5em}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0;box-shadow:var(--sh)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.top{margin-bottom:10px}
button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:11px 18px;cursor:pointer;background:var(--pri);color:#fff;box-shadow:0 4px 0 var(--pd);transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:none}button.g{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}button.g:active{background:var(--soft)}
button.sm{padding:7px 12px;font-size:14px;border-radius:12px}button.wide{width:100%}button.n{background:var(--bad);box-shadow:0 4px 0 #cc3f50}button.p{background:var(--sun);color:#3b2a00;box-shadow:0 4px 0 #c88a0c}button.m{background:var(--ok);box-shadow:0 4px 0 #148a52}
:focus-visible{outline:3px solid #9a90ff;outline-offset:2px}
input,textarea{font:inherit;width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}input:focus,textarea:focus{outline:none;border-color:var(--pri)}
label{display:block;font-weight:800;margin:12px 0 5px}.mut{color:var(--mut);font-size:14px}.tag{font-size:13px;font-weight:800;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--pri)}.tag.hot{background:#fff1d6;color:#a96a00}
.bar{height:12px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .3s}.bar.sm{height:8px;margin:6px 0 4px}
.hero{display:flex;gap:16px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#5848e5,#8a63f2);color:#fff;border-radius:26px;padding:22px;box-shadow:var(--sh)}
.hi{font:800 24px "Nunito","Noto Sans",sans-serif}.mut2{opacity:.88;font-size:14px;margin-top:4px}.fire{background:rgba(255,255,255,.18);border-radius:20px;padding:10px 16px;text-align:center;display:flex;flex-direction:column;line-height:1.1}.fire span{font-size:26px}.fire b{font-size:30px}.fire small{opacity:.85}
.set{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.set.due{border-left:6px solid var(--sun)}.empty{text-align:center;color:var(--mut);font-size:30px}.empty p{font-size:15px;margin:6px 0 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--sh)}.tile span{font-size:30px}.tile b{font:800 18px "Nunito","Noto Sans",sans-serif}.tile small{color:var(--mut)}.tile:active{background:var(--soft)}
.fc{text-align:center;padding:30px 16px;min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;border-radius:28px}
.fc .w{font-size:44px;line-height:1.15;overflow-wrap:anywhere}.ipa{color:var(--mut);font-size:19px;font-family:"Noto Sans","Segoe UI","Lucida Sans Unicode",system-ui,sans-serif;letter-spacing:0}.hint{color:var(--mut);font-size:14px;margin:8px 0 0}
.ans{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:6px;border-top:2px dashed var(--line);padding-top:16px;width:100%}.vi{font-size:28px;color:var(--pri)}.ex{font-size:17px;max-width:30em;margin:2px 0}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.three button{display:flex;flex-direction:column;align-items:center;font-size:26px;padding:12px 6px}.three small{font-size:13px}
.nav2{margin-top:6px}.q{text-align:center;padding:26px 18px}.qh{color:var(--mut);font-weight:800;margin-bottom:10px}.q .big{font-size:34px;color:var(--pri)}.sent{font-size:21px;line-height:1.6}.q input{margin:16px 0;text-align:center;font-size:18px}.bigbtn{font-size:30px;padding:14px 26px;border-radius:50%}
.fb{border-radius:16px;padding:12px;margin:0 0 14px;text-align:left}.fb.good{background:#e3f8ed;color:#0f6a40}.fb.miss{background:#ffe9ec;color:#a42a3b}.emo{font-size:52px}
.login{max-width:420px;margin:0 auto;text-align:center}.login .card{text-align:left}.mascot{font-size:64px}.login summary{cursor:pointer;font-weight:800;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}td input{padding:7px}.wrap{overflow-x:auto}
.ok{color:var(--ok);font-weight:800}.bad{color:var(--bad);font-weight:800}.big{font-size:34px}.lnk{cursor:pointer;color:var(--pri);font-weight:800}
#t{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;display:none;z-index:9;max-width:92vw;text-align:center}
.flip{perspective:1400px;cursor:pointer;margin:4px 0}.flipin{display:grid;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}.flipin.on{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:var(--sh);padding:22px 16px;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.back{transform:rotateY(180deg);background:#fbfaff}.face .w{font-size:42px;line-height:1.15;overflow-wrap:anywhere}.face .hint{margin:4px 0 0}
.spk{width:46px;height:46px;border-radius:50%;padding:0;font-size:20px;background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}.spk:active{background:var(--soft)}
.repchip{display:inline-block;background:#fff1d6;color:#a96a00;font-weight:800;border-radius:99px;padding:3px 12px;margin-bottom:8px;font-size:13px}.three{margin:12px 0 8px}
.sched{display:grid;gap:6px;margin:8px 0;text-align:left}.sched div{display:flex;justify-content:space-between;gap:8px;background:var(--soft);border-radius:12px;padding:8px 12px;font-size:14px}.hero2{background:var(--soft);border-radius:18px;padding:14px;margin:12px 0}.hero2 b{display:block;font-size:22px;color:var(--pri)}
@media(max-width:700px){nav.st{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav.st a{flex-direction:column;gap:0;font-size:12px;padding:4px 12px;border-radius:14px}nav.st a i{font-size:22px}#t{bottom:90px}.hero{flex-direction:column;align-items:flex-start}.face .w{font-size:34px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head></head><body>
<header><div class="logo">📘 IELTS Vocab</div><nav id="nav"></nav><div id="hx"></div></header>
<main id="app"></main><div id="t"></div>
<script>
const K='ielts_v1',TZ='Asia/Ho_Chi_Minh',DAYS=[1,3,7,12,18,24,30],D=864e5,REP={n:3,p:2,m:1};
let db=JSON.parse(localStorage.getItem(K)||'null')||{sets:[],students:{},teacher:null,key:'',me:null,role:null},V={p:'login'};
const $=s=>document.querySelector(s),save=()=>localStorage.setItem(K,JSON.stringify(db)),uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dk=d=>new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(d),fd=t=>t?new Date(t).toLocaleString('vi-VN'):'—';
const S=()=>db.role==='s'?(db.remote||db.sets):db.sets,me=()=>db.students[db.me],P=sid=>me().prog[sid]??={first:Date.now(),pos:0,rev:0,pr:0},W=id=>me().words[id]??={st:'n',seen:0,c:0,w:0};
const setOf=id=>id==='me'?{id:'me',book:'Từ vựng cá nhân',items:me().personal,status:'pub'}:S().find(s=>s.id===id);
const act=s=>s.items.filter(i=>!i.arch),title=s=>s.id==='me'?s.book:`${s.book}${s.test?' – Test '+s.test:''}${s.passage?' – Passage '+s.passage:''}`;
const due=p=>p&&p.init&&p.next&&p.next<=Date.now(),lg=(t,sid,x={})=>me().log.push({t,sid,at:Date.now(),...x});
function toast(m){const e=$('#t');e.textContent=m;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2800)}
function go(p,x={}){V={p,...x};render();scrollTo(0,0)}
function streakNow(){const m=me();return(m.day===dk(new Date())||m.day===dk(new Date(Date.now()-D)))?m.streak:0}
function bump(){const m=me(),t=dk(new Date());if(m.day===t)return;m.streak=m.day===dk(new Date(Date.now()-D))?m.streak+1:1;m.day=t}
function accent(){db.acc=db.acc==='en-US'?'en-GB':'en-US';save();render();toast('Đã chọn giọng '+(db.acc==='en-US'?'Mỹ':'Anh'))}
function speak(txt){if(!('speechSynthesis' in window))return toast('Trình duyệt không hỗ trợ âm thanh');const L=db.acc||'en-GB',v=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-')===L);
 if(!v)return toast('Máy chưa có giọng '+(L==='en-GB'?'Anh':'Mỹ')+'. Bấm "Giọng" trên menu để đổi giọng khác.');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.voice=v;u.lang=L;speechSynthesis.speak(u)}
speechSynthesis?.getVoices();
async function hash(s){return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function freeGen(ws){const out=[];for(const w of ws){let ipa='',pos='',ex='',vi='';
 try{const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w));if(r.ok){const e=(await r.json())[0];ipa=(e.phonetics||[]).map(p=>p.text).find(Boolean)||e.phonetic||'';pos=e.meanings?.[0]?.partOfSpeech||'';ex=(e.meanings||[]).flatMap(m=>m.definitions).map(d=>d.example).find(Boolean)||''}}catch{}
 try{const j=await(await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(w)+'&langpair=en|vi')).json();const t=j.responseData?.translatedText||'';vi=/MYMEMORY|QUERY LENGTH/i.test(t)?'':t}catch{}
 out.push({id:uid(),word:w,ipa,vi,pos,ex})}return out}
const ai=ws=>freeGen(ws);
/* ---------- auth ---------- */
function login(){const n=$('#n').value.trim().replace(/\s+/g,' '),c=$('#c').value.trim().replace(/\s+/g,' ');if(!n||!c)return toast('Nhập đủ tên và lớp');
 const k=(n+'|'+c).toLowerCase();db.students[k]??={name:n,cls:c,first:Date.now(),prog:{},words:{},personal:[],log:[],streak:0,day:null};db.me=k;db.role='s';me().last=Date.now();save();go('home')}
async function tlogin(){const p=$('#pw').value;if(p.length<6)return toast('Mật khẩu tối thiểu 6 ký tự');const h=await hash(p);
 if(!db.teacher){db.teacher=h;toast('Đã đặt mật khẩu cho thầy T')}else if(db.teacher!==h)return toast('Sai mật khẩu');db.role='t';save();go('tsets')}
function out(){db.role=null;db.me=null;save();go('login')}
/* ---------- student ---------- */
function btnFor(s){const p=me().prog[s.id];return !p?`<button onclick="openSet('${s.id}',1)">Start Learning</button>`:!p.init?`<button onclick="openSet('${s.id}',1)">Continue Learning</button>`:due(p)?`<button onclick="startReview('${s.id}')">Review Now</button>`:`<button class="g" onclick="go('set',{sid:'${s.id}'})">Mở bộ từ</button>`}
function openSet(sid){const L=act(setOf(sid)),p=P(sid);if(p.pos>=L.length)p.pos=0;save();go('fc',{sid,mode:'learn',pend:[],mainDone:0,show:L[p.pos]?.id,rep:0,flip:0,rv:0})}
function home(){const m=me(),dl=S().filter(s=>s.status==='pub'&&due(m.prog[s.id])).sort((a,b)=>m.prog[a.id].next-m.prog[b.id].next),st=streakNow(),h=new Date().getHours();
 return`<div class="hero"><div><div class="hi">${h<12?'Chào buổi sáng':h<18?'Chào buổi chiều':'Chào buổi tối'}, ${esc(m.name.split(' ')[0])}!</div><div class="mut2">${st?'Giữ lửa nhé, hôm nay học thêm một chút!':'Hoàn thành 1 Review hoặc Practice để bắt đầu chuỗi ngày học.'}</div></div><div class="fire"><span>🔥</span><b>${st}</b><small>ngày</small></div></div>
 <h2>Review Today</h2>${dl.length?dl.map(s=>`<div class="card set due"><div><b>${esc(s.book)}</b><div class="mut">${esc(title(s).slice(s.book.length+3)||'')}</div></div><button onclick="startReview('${s.id}')">Review Now</button></div>`).join(''):'<div class="card empty">🎉<p>Hôm nay không có bộ từ nào đến hạn ôn.<br>Vào thư viện để học hoặc luyện thêm nhé.</p></div>'}
 <h2>Vocabulary Library</h2><div class="tiles"><a class="tile" onclick="go('lib')"><span>📚</span><b>Cambridge</b><small>Bộ từ của thầy T</small></a><a class="tile" onclick="go('mine')"><span>⭐</span><b>My Vocabulary</b><small>${m.personal.filter(i=>!i.arch).length} từ</small></a></div>`}
function lib(){const ss=S().filter(s=>s.status==='pub'),bk=[...new Set(ss.map(s=>s.book))],m=me();
 return`<h1>Cambridge Vocabulary</h1>`+(bk.length?bk.map(b=>`<h2>${esc(b)}</h2>`+ss.filter(s=>s.book===b).map(s=>{const L=act(s),k=L.filter(i=>m.words[i.id]?.st==='m').length,p=m.prog[s.id],chip=!p?'Chưa học':!p.init?'Đang học':due(p)?'Đến hạn ôn':'Đã học xong';
 return`<div class="card set"><div style="flex:1;min-width:150px"><b>${esc(title(s).slice(b.length+3)||'Bộ từ')}</b> <span class="tag ${due(p)?'hot':''}">${chip}</span><div class="bar sm"><i style="width:${L.length?k/L.length*100:0}%"></i></div><div class="mut">${k}/${L.length} từ đã thuộc</div></div>${btnFor(s)}</div>`}).join('')).join(''):'<div class="card empty">📭<p>Thầy T chưa đăng bộ từ nào.</p></div>')}
function setPage(){const s=setOf(V.sid),p=P(s.id);return`<h1>${esc(title(s))}</h1><div class="card"><p class="mut">${act(s).length} từ · ${p.init?'Đã học xong lần đầu · Review '+p.rev+' · Lần ôn tới: '+fd(p.next):'Đang học lần đầu'}</p>
 <div class="row" style="justify-content:flex-start"><button onclick="openSet('${s.id}')">Flashcards</button>${due(p)?`<button onclick="startReview('${s.id}')">Review Now</button>`:''}<button class="p" onclick="startPractice('${s.id}')">Practice</button></div></div>`}
function mine(){const s=setOf('me'),items=act(s);return`<h1>My Vocabulary</h1><div class="card"><label>Thêm một từ tiếng Anh</label><input id="pw1" placeholder="vd: overwhelming">
 <div class="row" style="margin-top:10px;justify-content:flex-start"><button onclick="genPers()">Generate Vocabulary</button><button class="g" onclick="V.pv={word:$('#pw1').value.trim(),ipa:'',vi:'',pos:'',ex:''};render()">Nhập tay</button></div></div>
 ${V.pv?`<div class="card"><b>Xem lại trước khi lưu</b>${['word','ipa','vi','pos','ex'].map(k=>`<label>${{word:'Từ',ipa:'IPA',vi:'Nghĩa tiếng Việt',pos:'Từ loại',ex:'Câu ví dụ'}[k]}</label><input value="${esc(V.pv[k])}" oninput="V.pv.${k}=this.value">`).join('')}
 <div class="row" style="margin-top:12px;justify-content:flex-start"><button onclick="savePers()">Xác nhận &amp; lưu</button><button class="g" onclick="genPers(1)">Tạo lại</button><button class="g" onclick="V.pv=null;render()">Hủy</button></div></div>`:''}
 ${items.length?`<div class="row"><button onclick="openSet('me')">Flashcards</button><button class="p" onclick="startPractice('me')">Practice</button></div>`:''}
 ${items.map(i=>`<div class="card row"><div><b>${esc(i.word)}</b> <span class="mut">${esc(i.ipa)}</span><div class="mut">${esc(i.vi)}</div></div><button class="g" onclick="speak('${esc(i.word).replace(/'/g,'')}')">🔊</button></div>`).join('')}`}
async function genPers(again){const w=again?V.pv.word:$('#pw1').value.trim();if(!/^[A-Za-z][A-Za-z '-]*$/.test(w))return toast('Nhập một từ tiếng Anh hợp lệ');
 try{toast('Đang tạo…');V.pv=(await ai([w]))[0];render()}catch(e){toast(e.message)}}
function savePers(){const x=V.pv;if(!x.word||!x.vi||!x.ex)return toast('Cần có từ, nghĩa và câu ví dụ');if(me().personal.some(i=>!i.arch&&i.word.toLowerCase()===x.word.toLowerCase()))return toast('Từ này đã có');
 me().personal.push({id:uid(),...x});V.pv=null;save();toast('Đã lưu');render()}
/* ---------- flashcards + review ---------- */
function cur(){const s=setOf(V.sid),p=P(s.id),L=act(s);if(V.mode==='review'){const id=p.open.q[p.open.i];return{s,p,len:p.open.q.length,i:p.open.i,it:L.find(x=>x.id===id)}}
 return{s,p,len:L.length,i:Math.min(p.pos,L.length-1),it:L.find(x=>x.id===V.show)}}
function fc(){const{s,p,len,i,it}=cur(),rv=V.mode==='review';
 if(!it){if(!rv&&V.show===null&&V.pend.length)return waitView(s,len);return`<div class="card">Bộ từ chưa có từ nào.<p><button onclick="go('home')">Về trang chủ</button></p></div>`}
 const w=W(it.id),sp=esc(it.word).replace(/'/g,''),pos=rv?i+1:(V.mainDone?len:p.pos+1);
 return`<div class="row top"><button class="g sm" onclick="go('${rv?'home':'set'}',{sid:'${s.id}'})">← Thoát</button><b>${rv?'Review':'Flashcards'}</b><span class="mut">${pos}/${len}</span></div><div class="bar"><i style="width:${pos/len*100}%"></i></div>
 ${V.rep?'<div class="repchip">🔁 Ôn lại từ này</div>':''}
 <div class="flip" onclick="flipCard()"><div class="flipin ${V.flip?'on':''}" id="fi">
 <div class="face front"><div class="w">${esc(it.word)}</div><div class="ipa">${esc(it.ipa)}</div><button class="spk" aria-label="Nghe từ" onclick="event.stopPropagation();speak('${sp}')">🔊</button><p class="hint">Chạm vào thẻ để lật</p></div>
 <div class="face back"><div class="vi">${esc(it.vi)}</div><span class="tag">${esc(it.pos)}</span><p class="ex">“${esc(it.ex)}”</p><button class="spk" aria-label="Nghe câu" onclick="event.stopPropagation();speakEx()">🔊</button><p class="hint">Chạm để lật lại</p></div></div></div>
 <div class="three" id="rate" style="visibility:${V.rv?'visible':'hidden'}"><button class="n" onclick="mark('n')">😕<small>Chưa thuộc</small></button><button class="p" onclick="mark('p')">🤔<small>Hơi nhớ</small></button><button class="m" onclick="mark('m')">😎<small>Đã thuộc</small></button></div>
 <div class="row nav2"><button class="g sm" onclick="step(-1)">← Trước</button><span class="mut">${{n:'Chưa thuộc',p:'Hơi nhớ',m:'Đã thuộc'}[w.st]}${w.seen?'':' · từ mới'}</span><button class="g sm" onclick="step(1)">Sau →</button></div>`}
function flipCard(){const f=$('#fi');if(!f)return;V.flip=!V.flip;if(V.flip)V.rv=1;f.classList.toggle('on',V.flip);$('#rate').style.visibility=V.rv?'visible':'hidden'}
function waitView(s,len){const n=Math.max(0,Math.ceil((Math.min(...V.pend.map(x=>x.at))-Date.now())/1000));

 if(V.mode==='review'){const n=c.i+d;if(n<0)return;c.p.open.i=n;if(n>=c.len){finishReview(c);return}save();render();return}
 if(d<0){if(c.p.pos<=0)return;const L=act(c.s);c.p.pos--;V.show=L[c.p.pos].id;V.rep=0;save();render();return}

function startReview(sid){const s=setOf(sid),p=P(sid),L=act(s);if(!p.open){const o={n:0,p:1,m:2},srt=[...L].sort((a,b)=>o[W(a.id).st]-o[W(b.id).st]),q=[];
 for(let r=0;r<3;r++)srt.forEach(i=>{if(r<REP[W(i.id).st])q.push(i.id)});p.open={q,i:0,at:Date.now(),num:p.rev+1};save()}go('fc',{sid,mode:'review'})}

function startPractice(sid){const s=setOf(sid),L=act(s);if(L.length<1)return toast('Bộ từ chưa có từ');
 const wt=i=>{const w=W(i.id);return({n:4,p:2,m:1}[w.st])+(w.c+w.w===0?2:0)+w.w},pool=[...L],qs=[],n=Math.min(L.length,Math.max(5,Math.round(L.length*.6)),15);
 while(qs.length<n&&pool.length){let r=Math.random()*pool.reduce((a,i)=>a+wt(i),0),k=0;for(;k<pool.length-1&&(r-=wt(pool[k]))>0;k++);const it=pool.splice(k,1)[0];
 const T=['vi','blank','lw','ls'];let t=T[Math.floor(Math.random()*4)];if(t==='blank'&&!new RegExp(it.word,'i').test(it.ex))t='vi';qs.push({it,t})}

const norm=s=>s.toLowerCase().replace(/[^a-z0-9' ]/g,' ').split(/\s+/).filter(Boolean);
function lcs(a,b){const t=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)t[i][j]=a[i-1]===b[j-1]?t[i-1][j-1]+1:Math.max(t[i-1][j],t[i][j-1]);return t[a.length][b.length]}
function pr(){if(V.i>=V.qs.length)return prDone();const{it,t}=V.qs[V.i],sp=esc(it.word).replace(/'/g,'');
 const q={vi:`<div class="qh">Gõ từ tiếng Anh có nghĩa</div><div class="big">${esc(it.vi)}</div>`,blank:`<div class="qh">Điền từ còn thiếu</div><div class="sent">${esc(it.ex.replace(new RegExp(it.word,'i'),'________'))}</div>`,lw:`<div class="qh">Nghe và gõ từ bạn nghe được</div><button class="g bigbtn" onclick="speak('${sp}')">🔊</button>`,ls:`<div class="qh">Nghe và chép lại cả câu</div><button class="g bigbtn" onclick="speak(V.qs[V.i].it.ex)">🔊</button>`}[t];
 return`<div class="row top"><button class="g sm" onclick="go('set',{sid:'${V.sid}'})">← Thoát</button><b>Practice</b><span class="mut">${V.i+1}/${V.qs.length}</span></div><div class="bar"><i style="width:${V.i/V.qs.length*100}%"></i></div>
 <div class="card q">${q}<input id="ans" ${V.done?'disabled':''} value="${V.done?esc(V.given||''):''}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ câu trả lời…" onkeydown="if(event.key==='Enter')submitA()">
 ${V.done?`<div class="fb ${V.ok?'good':'miss'}"><b>${V.ok?'Chính xác! 🎉':'Chưa đúng'}</b><div>Đáp án: <b>${esc(t==='ls'?it.ex:it.word)}</b></div>${V.note?`<div class="mut">${V.note}</div>`:''}</div><button onclick="nextQ()">Tiếp tục</button>`:`<button onclick="submitA()">Kiểm tra</button>`}</div>`}
function submitA(){const{it,t}=V.qs[V.i],a=$('#ans').value.trim();if(!a)return;let ok;V.note='';
 if(t==='ls'){const A=norm(a),B=norm(it.ex);ok=lcs(A,B)/B.length>=.85;if(ok&&a.trim()!==it.ex)V.note='Lưu ý viết hoa/dấu câu: '+esc(it.ex)}else ok=a.toLowerCase()===it.word.toLowerCase();
 const w=W(it.id);ok?w.c++:w.w++;V.res.push({id:it.id,ok,t});V.ok=ok;V.given=a;V.done=1;save();render()}

 const c=V.res.filter(r=>r.ok).length,s=setOf(V.sid),bad=[...new Set(V.res.filter(r=>!r.ok).map(r=>s.items.find(i=>i.id===r.id)?.word))];
 return`<h1>Kết quả Practice</h1><div class="card"><div class="emo">${c/V.res.length>=.8?"🏆":c/V.res.length>=.5?"👍":"💪"}</div><div class="big">${Math.round(c/V.res.length*100)}%</div><p>${V.res.length} câu · ${c} đúng · ${V.res.length-c} sai</p><p class="mut">${bad.length?'Cần chú ý: <b>'+bad.map(esc).join(', ')+'</b>':'Không có từ nào sai 👏'}</p></div>
